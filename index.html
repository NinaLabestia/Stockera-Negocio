<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#161a22;--mu:#6b7280;--bd:#e4e8ef;--ac:#2563eb;--ok:#16a34a;--rd:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#101216;--card:#1a1d23;--tx:#eceef2;--mu:#9aa1ab;--bd:#2a2e36;--ac:#5b8def;--ok:#4ade80;--rd:#f87171;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px 14px 110px;max-width:640px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
.hero{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px}
.hero small{opacity:.8;font-size:13px}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:2px 0 12px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div,.mini2 div{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px}
.mini b,.mini2 b{display:block;font-size:15px}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;white-space:nowrap;border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 14px;font-size:14px;color:var(--mu)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.pc{text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;width:100%}
.pn{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp{font-size:22px;font-weight:700}
.pp span,.mu{font-size:12px;color:var(--mu);font-weight:400}
.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.pm{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.g{color:var(--ok);font-weight:600}
.pc.done{opacity:.6}.pc.done .pn{text-decoration:line-through}.pc.done .bar i{background:var(--ok)}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:36px 10px}
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:32px;line-height:1;box-shadow:0 8px 20px rgba(37,99,235,.4);z-index:10}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;transform:translateY(105%);transition:transform .25s;z-index:21}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--bd);margin:0 auto 12px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.sh .t{font-size:20px;font-weight:700}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;color:var(--mu)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tiles div{background:var(--bg);border-radius:14px;padding:10px 12px}
.tiles small{display:block;font-size:12px;color:var(--mu)}
.tiles b{font-size:17px}
.sell{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.sell input{width:100%;min-width:0;text-align:center;font-size:20px;font-weight:600;padding:10px 0;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
.st{border:1px solid var(--bd);background:var(--bg);width:46px;height:46px;border-radius:12px;font-size:22px;flex:none}
.go{flex:none;border:0;background:var(--ok);color:#fff;font-weight:700;padding:0 20px;height:46px;border-radius:12px}
.go:disabled{opacity:.4}
.row3{display:flex;gap:8px;margin-bottom:14px}
.s{flex:1;border:1px solid var(--bd);background:transparent;border-radius:12px;padding:10px;font-size:14px;color:var(--mu)}
.s.d{color:var(--rd)}
.hl{font-size:13px;color:var(--mu);padding:6px 0;border-top:1px solid var(--bd);display:flex;justify-content:space-between}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fm label{font-size:12px;color:var(--mu);display:block}
.fm input,.fm select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font-size:16px}
.fm .full{grid-column:1/-1}
.hh{display:flex;justify-content:space-between;align-items:center}.bk{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:#fff;border-radius:99px;padding:4px 12px;font-size:12px}
.ta{width:100%;height:110px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:12px/1.3 ui-monospace,monospace;resize:none}
.mini2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.mini2 small{font-size:12px}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;border:1px solid var(--bd);background:var(--bg);border-radius:12px;padding:9px;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.lt{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:2px}
.lt div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px}
.lt small{display:block;font-size:12px;color:var(--mu)}
.lt b{font-size:15px}
.lr{grid-column:1/-1;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;width:100%}
.lr .r1{display:flex;justify-content:space-between;gap:8px}
.pd{font-size:11px;color:var(--mu);margin-top:-4px}
.lr .s{flex:none;margin-top:6px}
.avail{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.avail b{font-size:18px}
.avail small{display:block}
.avail .bk{white-space:nowrap;padding:6px 14px;font-size:13px}
.hl{align-items:center;gap:8px}
.hl span:last-child{white-space:nowrap}
.seg button{padding:9px 4px;font-size:13px}
.cin{width:100%;padding:11px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font-size:16px;margin-bottom:8px}
.dbt{color:var(--rd);font-weight:600}
.hb{width:40px;height:34px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:0}
.hb i{display:block;width:18px;height:2px;background:#fff;border-radius:2px}
.avail2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 12px}
.avail2 .big{margin:0}
.mi{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.mi b{font-size:16px}
.ban{margin-bottom:12px;border-radius:18px;overflow:hidden;cursor:pointer}
.ban.empty{border:1.5px dashed var(--bd);color:var(--mu);text-align:center;padding:12px;font-size:14px}
.ban.has{background:var(--card);border:1px solid var(--bd);height:110px;display:flex;align-items:center;justify-content:center}
.ban img{max-width:100%;max-height:100%;display:block}
.ban.cover img{width:100%;height:100%;object-fit:cover}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,330px);background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);z-index:21;transform:translateX(-105%);transition:transform .3s cubic-bezier(.22,.9,.3,1);padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto;border-radius:0 26px 26px 0;box-shadow:8px 0 30px rgba(0,0,0,.25)}
.drawer.on{transform:none}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.drawer .dt{font-size:22px;font-weight:700}
.drawer .dg{font-size:28px;font-weight:700;color:var(--ok);margin:2px 0}
.drawer .mi{opacity:0}
.drawer.on .mi{animation:dIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms + 140ms)}
.mi.row{border:0;background:transparent;padding:14px 10px;margin:0;gap:14px;justify-content:flex-start;border-radius:14px;font-size:16px;font-weight:400}
.mi.row:active{background:var(--bg)}
.mi.row svg{flex:none;color:var(--ac)}
@keyframes dIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}.drawer.on .mi{animation:none;opacity:1}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .drawer{background:rgba(26,29,35,.72)}}
:root[data-theme="dark"] .drawer{background:rgba(26,29,35,.72)}
.drawer .mi:not(.row){background:rgba(127,127,127,.14)}
.mi.row b{display:block}
.mi.row .mu{margin-top:2px}
.pri{border:0;background:var(--ac);color:#fff;font-weight:700;padding:13px;border-radius:12px}

#intro{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:99999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse 65% 45% at 50% 42%,#2b2e38 0%,#13141a 55%,#060608 100%);transition:opacity .6s ease,visibility .6s}
#intro.out{opacity:0;visibility:hidden}
#intro .xw{perspective:900px;-webkit-perspective:900px;transition:transform .6s cubic-bezier(.6,0,1,.6)}
#intro.out .xw{transform:scale(1.6)}
#intro .xt{display:flex;font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:64px;font-size:clamp(50px,15vw,116px);line-height:1.1;letter-spacing:-1px;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;-webkit-box-reflect:below -10px linear-gradient(transparent 58%,rgba(255,255,255,.14))}
#intro .xt span{position:relative;display:inline-block;color:transparent;opacity:0}
#intro .xt span::before,#intro .xt span::after{content:attr(data-t);position:absolute;left:0;top:0}
#intro .xt span::before{color:#5d6579;text-shadow:1px 1px 0 #8a93a7,2px 2px 0 #5d6579,0 0 28px rgba(255,255,255,.30),0 16px 30px rgba(0,0,0,.55)}
#intro .xt span::after{color:transparent;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(105deg,transparent 38%,rgba(255,255,255,1) 50%,transparent 62%),linear-gradient(180deg,#f6f8fc 0%,#dde2ee 52%,#b4bccd 100%);background-size:300% 100%,100% 100%;background-repeat:no-repeat;background-position:160% 0,0 0}
#intro .xt .xp{width:.26em}
#intro .xg{position:absolute;left:50%;top:50%;width:90vmin;height:90vmin;margin:-45vmin 0 0 -45vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.34),rgba(255,255,255,.08) 42%,transparent 68%);opacity:0}
#intro .xl{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85) 50%,transparent);box-shadow:0 0 18px 3px rgba(255,255,255,.45);transform:scaleX(0);opacity:0}
#intro .xs{position:absolute;width:20px;height:20px;background:#fff;clip-path:polygon(50% 0,57% 43%,100% 50%,57% 57%,50% 100%,43% 57%,0 50%,43% 43%);-webkit-filter:drop-shadow(0 0 5px rgba(255,255,255,.9));filter:drop-shadow(0 0 5px rgba(255,255,255,.9));opacity:0}
#intro.go .xw{animation:xShake .5s ease-out 1.05s both}
#intro.go .xt{animation:xSway 3.4s ease-in-out 1.7s infinite alternate}
#intro.go .xt span{animation:xIn 1.15s cubic-bezier(.3,.7,.4,1) both;animation-delay:calc(var(--i)*.08s + .15s)}
#intro.go .xt span::after{animation:xShine .9s ease-in-out both;animation-delay:calc(var(--i)*.1s + 1.5s)}
#intro.go .xg{animation:xGlow 1.2s ease-out 1.1s both}
#intro.go .xl{animation:xLn 1s ease-out 1.1s both}
#intro.go .xs{animation:xSt .9s ease-out both}
@keyframes xIn{0%{opacity:0;filter:blur(14px);transform:translateZ(-3200px) rotateX(35deg)}30%{opacity:1;filter:blur(4px)}58%{filter:blur(0);transform:translateZ(170px) rotateX(-6deg)}74%{transform:translateZ(-50px) rotateX(2deg)}88%{transform:translateZ(18px)}100%{opacity:1;filter:blur(0);transform:translateZ(0) rotateX(0)}}
@keyframes xShine{from{background-position:160% 0,0 0}to{background-position:-60% 0,0 0}}
@keyframes xSway{from{transform:rotateY(-6deg) rotateX(2deg)}to{transform:rotateY(6deg) rotateX(-2deg)}}
@keyframes xShake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,3px)}55%{transform:translate(3px,-2px)}80%{transform:translate(-1px,1px)}}
@keyframes xGlow{0%{opacity:0;transform:scale(.4)}35%{opacity:.85}100%{opacity:0;transform:scale(1.3)}}
@keyframes xLn{0%{opacity:0;transform:scaleX(0)}30%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1.12)}}
@keyframes xSt{0%{opacity:0;transform:scale(0) rotate(0)}45%{opacity:1;transform:scale(1.2) rotate(40deg)}100%{opacity:0;transform:scale(0) rotate(80deg)}}
@media (prefers-reduced-motion:reduce){#intro .xt span{opacity:1}#intro .xt span::after{background-position:-60% 0,0 0}#intro .xg,#intro .xl,#intro .xs{display:none}#intro.go *,#intro.go *::after{animation:none!important}}
</style>

<script>(function(){var i=document.getElementById('intro');if(!i)return;var r=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches,s=false;function c(){i.classList.add('out');setTimeout(function(){if(i.parentNode)i.parentNode.removeChild(i)},700)}function go(){if(s)return;s=true;i.classList.add('go');setTimeout(c,r?1200:3700)}i.onclick=c;if(window.Promise&&document.fonts&&document.fonts.load){Promise.race([document.fonts.load('800 1em Montserrat'),new Promise(function(a){setTimeout(a,900)})]).then(go,go)}else setTimeout(go,300)})()</script>

<script>
var KEY='stock_v1',items=[],flt='all',openId=null,mode='view',sellN=1,delC=false,payM='e',pre=null,warnOnce=false,delR=null,clTmp='',cliK=null,delP=null,cliList=[],delCm=null,delJ=null;
try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}
var RK='stock_ret_v1',ret=[];
try{ret=JSON.parse(localStorage.getItem(RK)||'[]')}catch(e){ret=[]}
var PK='stock_pay_v1',pagos=[];
try{pagos=JSON.parse(localStorage.getItem(PK)||'[]')}catch(e){pagos=[]}
var CK='stock_cam_v1',cambios=[];
try{cambios=JSON.parse(localStorage.getItem(CK)||'[]')}catch(e){cambios=[]}
var LK='stock_logo_v1',logo=null;
try{logo=JSON.parse(localStorage.getItem(LK)||'null')}catch(e){logo=null}
var CJ='stock_caja_v1',caja=[];
try{caja=JSON.parse(localStorage.getItem(CJ)||'[]')}catch(e){caja=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function saveR(){try{localStorage.setItem(RK,JSON.stringify(ret))}catch(e){}}
function savePg(){try{localStorage.setItem(PK,JSON.stringify(pagos))}catch(e){}}
function saveCm(){try{localStorage.setItem(CK,JSON.stringify(cambios))}catch(e){}}
function saveCj(){try{localStorage.setItem(CJ,JSON.stringify(caja))}catch(e){}}
function $(i){return document.getElementById(i)}
function m(n){return '$'+(Math.round(n*100)/100).toLocaleString('es-AR')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function find(id){return items.filter(function(x){return x.id===id})[0]}
function fd(d){return new Date(d).toLocaleDateString('es-AR')}
function setF(f){flt=f;render()}
function render(){
  var cob=0,gan=0,ven=0,pen=0,ef=0,tr=0,h='';
  items.forEach(function(it){var gu=it.price-it.cost;cob+=it.sold*it.price;gan+=it.sold*gu;ven+=it.sold;pen+=(it.qty-it.sold)*gu;(it.log||[]).forEach(function(x){var v=x.n*it.price;if(x.pay==='t')tr+=v})});
  $('tVen').textContent=ven;$('tPen').textContent=m(pen);
  $('tDis').textContent=m(Math.round(avail()));
  var bx=function(l,v){return '<div><small>'+l+'</small><b>'+m(v)+'</b></div>'};
  var cl2=clients(),fs=0,fdeu=0,pe=0,pt=0;
  cl2.forEach(function(c){fs+=c.sales;fdeu+=Math.max(0,c.debt)});
  pagos.forEach(function(p){if(p.pay==='t')pt+=p.amt;else pe+=p.amt});
  var bc=balances();$('tCob').textContent=m(bc.ef+bc.tr);
  var bl=balances();
  $('pay').innerHTML=bx('Efectivo',bl.ef)+bx('Transferencia',bl.tr)+'<div onclick="setF(\'fiados\')" style="cursor:pointer"><small>Te deben</small><b>'+m(fdeu)+'</b></div>';
  var cs=document.querySelectorAll('.chip');
  for(var i=0;i<cs.length;i++){cs[i].classList.toggle('on',cs[i].getAttribute('data-f')===flt)}

  e.preventDefault();var a=parseFloat($('ca').value),d=$('cd').value;if(!(a>0))return;
  var b=balances(),src=d==='et'?b.ef:b.tr;
  if(a>src+0.005&&!warnOnce){warnOnce=true;$('cmm').textContent='Ojo: en '+(d==='et'?'Efectivo':'Transferencia')+' tenés '+m(src)+', menos de lo que querés cambiar. Tocá Guardar otra vez si igual querés hacerlo.';return}
  cambios.push({id:Date.now(),d:new Date().toISOString(),dir:d,amt:a,note:$('cn').value.trim()});saveCm();closeP();render();
}
function delCam(id){if(delCm===id){cambios=cambios.filter(function(r){return r.id!==id});delCm=null;saveCm();render()}else{delCm=id;renderSheet()}}
function nk(s){return String(s||'').trim().toLowerCase()}
function clients(){
  var mp={};
  function get(name){var k=nk(name);return mp[k]=mp[k]||{k:k,name:String(name).trim(),sales:0,gan:0,paid:0,last:'',rows:[]}}
  items.forEach(function(it){(it.log||[]).forEach(function(x){
    if(x.pay!=='f'||!x.cl)return;
    var c=get(x.cl),a=x.n*x.p;c.sales+=a;c.gan+=x.n*x.g;if(x.d>c.last)c.last=x.d;
    c.rows.push({d:x.d,t:'v',txt:it.name+' · '+x.n+' u.',amt:a});
  })});
  pagos.forEach(function(p){var c=get(p.cl);c.paid+=p.amt;if(p.d>c.last)c.last=p.d;c.rows.push({d:p.d,t:'p',id:p.id,txt:'Pago ('+(p.pay==='t'?'Transferencia':'Efectivo')+')',amt:p.amt})});
  return Object.keys(mp).map(function(k){var c=mp[k];c.debt=c.sales-c.paid;c.pend=(c.debt>0&&c.sales>0)?c.debt*(c.gan/c.sales):0;return c}).sort(function(a,b){return b.debt-a.debt});
}
function fiadosHTML(){
  var cs=clients().filter(function(c){return c.sales>0});cliList=cs;
  if(!cs.length)return '<div class="empty">Todavía no fiaste nada. Al vender, elegí <b>Fiado</b> y escribí el nombre del cliente.</div>';
  var tot=0,n=0;cs.forEach(function(c){if(c.debt>0.005){tot+=c.debt;n++}});
  return '<div class="lt" style="grid-template-columns:1fr 1fr"><div><small>Te deben en total</small><b class="dbt">'+m(tot)+'</b></div><div><small>Clientes con deuda</small><b>'+n+'</b></div></div>'+
  cs.map(function(c,i){var d=c.debt>0.005;return '<button class="lr" onclick="openC('+i+')"><div class="r1"><b>'+esc(c.name)+'</b><span class="'+(d?'dbt':'g')+'">'+(d?m(c.debt):'Al día')+'</span></div><div class="mu">Último movimiento: '+fdm(c.last)+(d?' · tocá para cobrar':'')+'</div></button>'}).join('');
}
function openC(i){cliK=cliList[i].k;mode='cli';openId=null;delP=null;renderSheet()}
function cliHTML(){
  var c=clients().filter(function(x){return x.k===cliK})[0];
  if(!c){return ''}
  var d=c.debt>0.005;
  var rows=c.rows.slice().sort(function(a,b){return a.d<b.d?1:-1}).map(function(r){
    return '<div class="hl"><span>'+fdm(r.d)+' · '+esc(r.txt)+'</span><span>'+(r.t==='p'?'-'+m(r.amt)+' <button class="s" style="flex:none;padding:3px 8px;font-size:12px" onclick="delPago('+r.id+')">'+(delP===r.id?'¿Seguro?':'Quitar')+'</button>':m(r.amt))+'</span></div>'}).join('');
  return '<div class="grab"></div><div class="sh"><div><div class="t">'+esc(c.name)+'</div><div class="mu">'+(d?'Te debe '+m(c.debt):'Está al día')+'</div></div><button class="x" onclick="closeP()">✕</button></div>'+
  (d?'<form class="fm" onsubmit="saveCobro(event)"><div class="full"><label>¿Cuánto te pagó?</label><input id="pa" type="number" inputmode="decimal" step="any" min="0.01" required value="'+Math.round(c.debt*100)/100+'"></div><div class="full"><label>¿Cómo te pagó?</label><select id="pm"><option value="e">Efectivo</option><option value="t">Transferencia</option></select></div><div class="mu full" id="cm"></div><button class="pri full" type="submit">Registrar pago</button></form>':'')+
  '<div class="mu" style="margin:14px 0 4px">Movimientos</div>'+rows;
}
function saveCobro(e){
  e.preventDefault();
  var c=clients().filter(function(x){return x.k===cliK})[0],a=parseFloat($('pa').value);
  if(!c||!(a>0))return;
  if(a>c.debt+0.5){$('cm').textContent='Es más de lo que te debe ('+m(c.debt)+').';return}
  pagos.push({id:Date.now(),d:new Date().toISOString(),cl:c.name,amt:a,pay:$('pm').value});savePg();closeP();render();
}
function delPago(id){if(delP===id){pagos=pagos.filter(function(r){return r.id!==id});delP=null;savePg();render()}else{delP=id;renderSheet()}}
function fdm(d){var x=new Date(d);return x.getDate()+'/'+(x.getMonth()+1)}
function reponer(id){var it=find(id);if(!it)return;pre={name:it.name,cost:it.cost,price:it.price};mode='new';openId=null;renderSheet()}
function rebuy(id){var it=find(id);if(!it)return;pre={name:it.name,cost:it.cost,price:it.price,from:it.id};mode='new';openId=null;renderSheet()}
function prods(){mode='prod';openId=null;renderSheet()}
function prodHTML(){
  var G={},O=[],T={s:0,cb:0,gn:0},h='<div class="grab"></div><div class="sh"><div class="t">Mis productos</div><button class="x" onclick="closeP()">✕</button></div>';
  items.forEach(function(it){if(it.rep||it.sold>=it.qty)return;var k=nk(it.name);if(!G[k]){G[k]={id:it.id,n:it.name,q:0,s:0,cb:0,fi:0,gn:0,lc:it.cost,lq:it.qty};O.push(G[k])}
    var g=G[k],f=0;(it.log||[]).forEach(function(x){if(x.pay==='f')f+=x.n*(x.p||it.price)});
    g.q+=it.qty;g.s+=it.sold;g.gn+=it.sold*(it.price-it.cost);g.fi+=f;g.cb+=it.sold*it.price-f});
  if(!O.length)return h+'<div class="empty">No hay productos con stock en curso. Cuando cargues o repongas uno, aparece acá; cuando se vende todo, desaparece.</div>';
  O.sort(function(a,b){return b.s-a.s});
  O.forEach(function(p){T.s+=p.s;T.cb+=p.cb;T.gn+=p.gn});
  h+='<div style="display:grid;gap:8px"><div class="lt"><div><small>Vendidas</small><b>'+T.s+' u.</b></div><div><small>Vas ganando</small><b>'+m(T.cb)+'</b></div><div><small>Ganancia</small><b class="g">'+m(T.gn)+'</b></div></div>';
  O.forEach(function(p){
    var need=p.lc*p.lq,ok=p.cb>=need,pct=p.q?Math.round(p.s/p.q*100):0;
    h+='<div class="lr"><div class="r1"><b>'+esc(p.n)+'</b><span class="g">+'+m(p.gn)+'</span></div>'+
    '<div class="mu">Vendiste '+p.s+' de '+p.q+' u. · quedan '+(p.q-p.s)+'</div>'+
    '<div style="height:6px;border-radius:3px;background:var(--bd);overflow:hidden;margin:2px 0"><div style="height:100%;width:'+pct+'%;background:#2563eb"></div></div>'+
    '<div class="mu">Plata en mano de este producto: <b>'+m(p.cb)+'</b></div>'+
    (p.fi>0?'<div class="mu">En fiado: '+m(p.fi)+' (puede que ya lo hayan pagado, mirá Fiados)</div>':'')+
    '<div class="mu">Volver a comprar '+p.lq+' u. a '+m(p.lc)+' = '+m(need)+'</div>'+
    '<div style="font-weight:600;color:'+(ok?'var(--ok)':'#e5484d')+'">'+(ok?'Te alcanza para reponer ✓':'Te faltan '+m(need-p.cb)+' para reponer')+'</div><button class="s" style="width:100%;margin-top:8px" onclick="reponer('+p.id+')">+ Reponer</button></div>';
  });
  return h+'<div class="mu" style="text-align:center;padding:4px 8px">No descuenta la ganancia que ya usaste con "Usar ganancia".</div></div>';
}
function newP(){mode='new';openId=null;pre=null;renderSheet()}
function openP(id){openId=id;mode='view';sellN=1;delC=false;payM='e';clTmp='';renderSheet()}
function closeP(){openId=null;mode='view';delC=false;sellN=1;payM='e';pre=null;warnOnce=false;delR=null;clTmp='';cliK=null;delP=null;delCm=null;delJ=null;renderSheet()}
function stp(d){sellN=Math.max(1,(parseInt($('sn').value,10)||1)+d);$('sn').value=sellN}
function sell(){
  var it=find(openId),n=Math.min(parseInt($('sn').value,10)||0,it.qty-it.sold);if(n<1)return;
  var e={n:n,d:new Date().toISOString(),pay:payM};
  if(payM==='f'){var cn=($('cl')||{value:''}).value.trim();if(!cn){if($('cl'))$('cl').focus();return}e.cl=cn;e.p=it.price;e.g=it.price-it.cost}
  it.sold+=n;(it.log=it.log||[]).push(e);sellN=1;payM='e';clTmp='';save();render();
}
function undo(){var it=find(openId);if(it.sold>0){var l=it.log&&it.log[it.log.length-1];if(l){l.n--;if(l.n<1)it.log.pop()}it.sold--;save();render()}}
function del(){if(delC){items=items.filter(function(x){return x.id!==openId});save();closeP();render()}else{delC=true;renderSheet()}}
function saveForm(e){
  e.preventDefault();
  var name=$('fn').value.trim(),q=parseInt($('fq').value,10),c=parseFloat($('fc').value),p=parseFloat($('fp').value);
  if(mode==='new'){items.unshift({id:Date.now(),name:name,qty:q,cost:c,price:p,date:new Date().toISOString(),sold:0});save();
    var g=$('fg').value,am=g==='t'?q*c:g==='p'?(parseFloat($('fgm').value)||0):0;
    if(am>0){ret.push({id:Date.now()+1,d:new Date().toISOString(),amt:am,why:'Compra: '+name,box:'n'});saveR()}
    var fb=$('fb').value;if((fb==='e'||fb==='t')&&q*c>0){caja.push({id:Date.now()+2,d:new Date().toISOString(),box:fb,amt:-q*c,why:'Compra: '+name});saveCj()}
    if(pre&&pre.from){var o=find(pre.from);if(o){o.rep=new Date().toISOString();save()}}
    closeP()}
  else{var it=find(openId);it.name=name;it.qty=Math.max(it.sold,q);it.cost=c;it.price=p;mode='view';save()}
  render();
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeP()});
(function(){var x0=null,d=$('drawer');d.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});d.addEventListener('touchend',function(e){if(x0!==null&&e.changedTouches[0].clientX-x0<-60)closeP();x0=null},{passive:true})})();
render();renderBan();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
